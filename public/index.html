<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#302943" />
  <meta name="description" content="Soft Hours，一间收藏友谊回忆的互动小房间。旋转房间，打开物品，慢慢找回那些时光。" />
  <title>Soft Hours · 我们的回忆小屋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=title-subtitle-spacing-2" /><link rel="stylesheet" href="./board.css" /><link rel="stylesheet" href="./photos.css" /><link rel="stylesheet" href="./glass.css" />
  <link rel="stylesheet" href="./coffee-machine.css" /><link rel="stylesheet" href="./drink-studio.css" /><link rel="stylesheet" href="./drink-studio-polish.css" /><link rel="stylesheet" href="./private-gate.css" />
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./scene.js?v=doorbell-1"></script>
  <script type="module" src="./script.js?v=doorbell-1"></script>
  <script type="module" src="./room-music.js?v=long-1"></script>
  <link rel="stylesheet" href="./birthday.css?v=birthday-day-1" />
  <link rel="stylesheet" href="./room-updates.css?v=1" />
  <link rel="stylesheet" href="./doorbell.css?v=1" />
  <script type="module" src="./birthday.js?v=birthday-day-1"></script>
<link rel="stylesheet" href="./records.css?v=reference-beamed-notes-20261105">
<link rel="stylesheet" href="./little-things.css?v=toast-player-spacing-1">
<link rel="stylesheet" href="./snowglobe.css?v=room-finds-2"><link rel="stylesheet" href="./hand-cursor.css?v=cat-bubble-mobile-1"><script type="module" src="./hand-cursor.js"></script><link rel="stylesheet" href="./memory-gallery.css?v=goal-save-2"></head>
<body>
  <main class="page">
    <section class="room-section" id="roomSection" aria-label="Soft Hours 三维回忆小屋">
      <div class="room-sticky">
        <div class="backdrop-glow" aria-hidden="true"></div>
        <header class="topbar">
          <div class="topbar__identity">
            <span class="topbar__mark" aria-label="J and K">J<span>&amp;</span>K</span>
            <button id="roomUpdates" class="topbar__reset room-updates-button" type="button" aria-label="小屋更新" hidden><span aria-hidden="true">✦</span><span class="room-updates-badge" aria-hidden="true" hidden>新</span></button>
          </div>
          <div class="topbar__tools"><button id="roomMusic" class="topbar__reset" type="button" aria-pressed="false">音乐关</button><button id="privateLogin" class="topbar__reset" type="button">J/K 登录</button><button id="resetView" class="topbar__reset" type="button">回到原位 <span aria-hidden="true">↗</span></button></div>
        </header>

        <button id="globeButton" class="globe-entry" type="button" disabled><span aria-hidden="true">✧</span>小小宇宙</button><div id="heroCopy" class="hero-copy">
          <h1>Soft Hours</h1>
          <p class="hero-copy__sub">有些时光，适合住进一间小屋里。</p>
        </div>

        <div class="scene-area" id="sceneArea">
          <canvas id="roomCanvas" tabindex="0" aria-label="三维房间：拖动旋转，滚轮或双指缩放；键盘方向键旋转，加减键缩放，0 恢复视角，C 开合窗帘"></canvas>
          <div id="nightDim" class="night-dim" aria-hidden="true"></div>
          <div class="scene-loader" id="sceneLoader" role="status">正在打开小屋…</div>
          <div class="hover-label" id="hoverLabel" hidden></div>
        </div>

        <p id="bedStatus" role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);"></p><nav class="scene-actions" aria-label="回忆物品快捷入口">
          <button type="button" data-action="wardrobe">衣柜</button>
          <button type="button" data-action="record">唱片</button>
          <button type="button" data-action="lamp">台灯</button>
          <button type="button" data-action="board">公告板</button>
          
        </nav>
        <div class="zoom-controls" aria-label="模型缩放"><button id="zoomOut" type="button" aria-label="缩小模型">−</button><output id="zoomLevel" aria-live="polite">100%</output><button id="zoomIn" type="button" aria-label="放大模型">+</button></div>
        <div class="scene-guide" id="sceneGuide"><span class="guide-symbol">↔</span> 拖动旋转 · 滚轮 / 双指缩放 · 点击物品 · 拖窗帘开合</div>
        <div class="scene-foot"><span>SOFT HOURS / 01</span><span>一间慢慢装满回忆的房间</span><span id="timeLabel">GOLDEN HOUR</span></div>
      </div>
    </section>
  </main>

  <dialog class="birthday" id="birthday" aria-labelledby="birthdayTitle">
    <div class="birthday-danmaku" id="birthdayDanmaku" aria-hidden="true"></div>
    <div class="birthday__card">
      <p class="birthday__eyebrow">SOFT HOURS · 寄给今天的你</p>
      <div id="birthdayEnvelope">
        <div class="birthday__envelope" aria-hidden="true"><span>✦</span></div>
        <h2 id="birthdayTitle">生日快乐！</h2>
        <p class="birthday__copy">小屋替你留了一个小惊喜。</p>
        <button id="birthdayOpen" type="button" autofocus>拆开生日信</button>
      </div>
      <div id="birthdayWish" hidden>
        <div class="birthday__stars" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i><i>✧</i></div>
        <svg class="birthday__cake" viewBox="0 0 100 84" aria-hidden="true">
          <path d="M50 34V23" stroke="#947ba3" stroke-width="4" stroke-linecap="round"/>
          <path d="M50 7c8 8 5 13 0 13s-7-5 0-13Z" fill="#e3a65d"/>
          <rect x="25" y="33" width="50" height="32" rx="9" fill="#e5b6c2"/>
          <path d="M25 45v-3a9 9 0 0 1 9-9h32a9 9 0 0 1 9 9v4c-6 1-7 8-13 8-5 0-5-6-11-6s-7 7-13 7c-5 0-6-9-13-10Z" fill="#fff4de"/>
          <path d="M19 67h62" stroke="#b29abf" stroke-width="4" stroke-linecap="round"/>
          <circle cx="37" cy="59" r="1.5" fill="#fff2e3"/><circle cx="63" cy="60" r="1.5" fill="#fff2e3"/>
        </svg>
        <h2 id="birthdayGreeting" tabindex="-1">生日快乐！</h2>
        <p class="birthday__copy">愿新的一岁，有好吃的蛋糕，<br>也有很多可以慢慢过的好时光。</p>
        <button id="birthdayEnter" type="button">走进小屋</button>
      </div>
    </div>
  </dialog>

  <div class="modal-shell" id="modalShell" hidden>
    <div class="modal-scrim" data-close="true"></div>
    <section class="memory-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <button class="memory-panel__close" type="button" id="closePanel" aria-label="关闭弹窗"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="memory-panel__scroll">
      <span class="memory-panel__number" id="panelNumber"></span>
      <h2 id="panelTitle"></h2>
      <p class="memory-panel__intro" id="panelIntro"></p>
      <div id="panelBody"></div>
      </div>
    </section>
  </div>
</body>
</html>
